# Centralized Lychee configuration for CI and local checks.
# Excludes are regex patterns.
exclude = [
  "\\$\\{slug\\}",
  "%7Bslug%7D",
  "^https://www\\.doxygen\\.nl/?$",
  "https://github.com/customer-terms/github-copilot-product-specific-terms",
  "https://sylabs.io/singularity/",
  # Trusted site; its certificate chain is not in lychee's bundled root store.
  "^https://www\\.softwareheritage\\.org",
]

max_redirects = 10
# 418 added: freedesktop.org rejects the automated checker with a joke
# "I'm a teapot" status even though the page itself loads fine in a browser.
accept = [200, 203, 206, 300, 301, 302, 303, 307, 308, 418]

# Robustness settings for transient network issues
timeout = 40
# max_retries and retry_wait_time bumped: zenodo.org intermittently returns
# 504 Gateway Timeout under load; more attempts with a longer backoff give
# it a better chance to recover before we report it as broken.
max_retries = 5
retry_wait_time = 5
max_concurrency = 10


