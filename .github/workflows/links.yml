name: Check Links

on:
  repository_dispatch:
  workflow_dispatch:
  schedule:
    - cron: "00 18 * * *"
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
jobs:
  linkChecker:
    runs-on: ubuntu-latest
    permissions:
      issues: write # required for peter-evans/create-issue-from-file
    steps:
      - uses: actions/checkout@v7

      - name: Link Checker (CI strict)
        if: github.event_name != 'schedule'
        id: lychee_strict
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --verbose --no-progress --root-dir ${{ github.workspace }} 'web/**/*.jsx' './**/*.md' './quality-tools/**/*.json'
          fail: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Link Checker (scheduled report)
        if: github.event_name == 'schedule'
        id: lychee_schedule
        uses: lycheeverse/lychee-action@v2
        with:
          args: --config lychee.toml --verbose --no-progress --root-dir ${{ github.workspace }} 'web/**/*.jsx' './**/*.md' './quality-tools/**/*.json'
          fail: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for real errors (ignore timeout-only reports)
        if: github.event_name == 'schedule' && steps.lychee_schedule.outputs.exit_code != 0
        id: check_errors
        run: |
          if grep -q "^## Errors per input" ./lychee/out.md; then
            echo "Real errors found (not just timeouts) — will open an issue."
            echo "has_errors=true" >> "$GITHUB_OUTPUT"
          else
            echo "Only timeouts/redirects, no hard errors — skipping issue creation."
            echo "has_errors=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Issue From File
        if: github.event_name == 'schedule' && steps.check_errors.outputs.has_errors == 'true'
        uses: peter-evans/create-issue-from-file@v6
        with:
          title: Link Checker Report
          content-filepath: ./lychee/out.md
          labels: report, automated issue